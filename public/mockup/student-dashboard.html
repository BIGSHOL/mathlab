<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 대시보드 - MathLab</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: #f6f6f8;
      color: #1E293B;
      font-size: 15px;
      line-height: 1.8;
    }

    /* Header */
    .header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-size: 20px;
      font-weight: 700;
      color: #135bec;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo span { color: #F97316; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #135bec, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }
    .user-name { font-weight: 600; font-size: 14px; }

    /* Main */
    .main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
    .page-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .streak {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748B;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .streak-icon { color: #F97316; font-size: 18px; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
    }
    .stat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .stat-icon.blue { background: #eff6ff; color: #135bec; }
    .stat-icon.orange { background: #fff7ed; color: #F97316; }
    .stat-icon.indigo { background: #eef2ff; color: #6366f1; }
    .stat-label { font-size: 13px; color: #64748B; font-weight: 500; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-value .suffix { font-size: 16px; color: #64748B; font-weight: 500; margin-left: 4px; }
    .stat-sub { font-size: 12px; color: #64748B; margin-top: 4px; }
    .progress-bar {
      height: 6px;
      background: #f1f5f9;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .progress-fill.indigo { background: #6366f1; }

    /* Content Grid */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
    }
    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    /* Card */
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .card-title { font-size: 18px; font-weight: 700; }
    .card-link {
      color: #135bec;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-link:hover { text-decoration: underline; }

    /* Learning Item */
    .learning-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .learning-item:hover { border-color: #bfdbfe; }
    .learning-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #dbeafe;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .learning-info { flex: 1; }
    .learning-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .learning-stage { font-size: 13px; color: #64748B; }
    .btn {
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #135bec;
      color: white;
    }
    .btn-primary:hover { background: #0e4bcc; }
    .btn-ghost {
      background: transparent;
      color: #1E293B;
      border: 1px solid #e2e8f0;
    }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-full { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Empty State */
    .empty { text-align: center; padding: 32px; color: #64748B; }

    /* Bottom Nav (mobile) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 8px 0;
      z-index: 50;
    }
    @media (max-width: 768px) {
      .bottom-nav { display: flex; justify-content: space-around; }
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: #64748B;
      text-decoration: none;
      padding: 4px 8px;
    }
    .nav-item.active { color: #135bec; }
    .nav-item svg { width: 24px; height: 24px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-blue { background: #eff6ff; color: #2563eb; }
    .badge-green { background: #f0fdf4; color: #16a34a; }
    .badge-orange { background: #fff7ed; color: #ea580c; }
    .badge-purple { background: #faf5ff; color: #7c3aed; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      Math<span>Lab</span>
    </div>
    <div class="header-right">
      <div class="avatar">김</div>
      <span class="user-name">김수학</span>
    </div>
  </header>

  <!-- Main -->
  <div class="main">
    <h1 class="page-title">대시보드</h1>
    <div class="streak">
      <span class="streak-icon">🔥</span>
      7일 연속 학습 중입니다! 계속해서 힘내세요.
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon blue">🏅</div>
          <div>
            <div class="stat-label">현재 레벨</div>
            <div class="stat-value">Level 5</div>
            <div class="stat-sub">다음 레벨까지 230 XP</div>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon orange">⭐</div>
          <div>
            <div class="stat-label">나의 포인트</div>
            <div class="stat-value">1,280</div>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon indigo">✅</div>
          <div>
            <div class="stat-label">완료한 개념</div>
            <div class="stat-value">12<span class="suffix">/ 48</span></div>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill indigo" style="width: 25%"></div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content-grid">
      <!-- In-progress Learning -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">진행 중인 학습</h2>
          <a href="#" class="card-link">모두 보기 →</a>
        </div>
        <div>
          <div class="learning-item">
            <div class="learning-icon">📖</div>
            <div class="learning-info">
              <div class="learning-title">수학Ⅱ: 정적분의 활용</div>
              <div class="learning-stage">
                <span class="badge badge-orange">Stage 3 - 빈칸 채우기 (어려움)</span>
              </div>
            </div>
            <button class="btn btn-primary">이어서 하기</button>
          </div>
          <div class="learning-item">
            <div class="learning-icon">📖</div>
            <div class="learning-info">
              <div class="learning-title">미적분: 치환적분법</div>
              <div class="learning-stage">
                <span class="badge badge-green">Stage 2 - 빈칸 채우기 (쉬움)</span>
              </div>
            </div>
            <button class="btn btn-primary">이어서 하기</button>
          </div>
          <div class="learning-item">
            <div class="learning-icon">📖</div>
            <div class="learning-info">
              <div class="learning-title">확률과 통계: 조건부확률</div>
              <div class="learning-stage">
                <span class="badge badge-blue">Stage 1 - 개념 읽기</span>
              </div>
            </div>
            <button class="btn btn-primary">이어서 하기</button>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <div class="card">
          <h2 class="card-title" style="margin-bottom: 20px;">빠른 실행</h2>
          <div class="quick-actions">
            <button class="btn btn-primary btn-full">▶ 학습 시작하기</button>
            <button class="btn btn-ghost btn-full">🏆 랭킹 확인하기</button>
          </div>
        </div>

        <!-- Weekly Activity -->
        <div class="card">
          <h2 class="card-title" style="margin-bottom: 20px;">이번 주 활동</h2>
          <div style="display: flex; justify-content: space-between; align-items: flex-end; height: 120px; padding: 0 8px;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #dbeafe; border-radius: 4px; height: 40px;"></div>
              <span style="font-size: 11px; color: #64748B;">월</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #dbeafe; border-radius: 4px; height: 65px;"></div>
              <span style="font-size: 11px; color: #64748B;">화</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #dbeafe; border-radius: 4px; height: 30px;"></div>
              <span style="font-size: 11px; color: #64748B;">수</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #dbeafe; border-radius: 4px; height: 80px;"></div>
              <span style="font-size: 11px; color: #64748B;">목</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #93c5fd; border-radius: 4px; height: 55px;"></div>
              <span style="font-size: 11px; color: #64748B;">금</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #135bec; border-radius: 4px; height: 95px;"></div>
              <span style="font-size: 11px; font-weight: 600; color: #135bec;">토</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <div style="width: 24px; background: #f1f5f9; border-radius: 4px; height: 10px;"></div>
              <span style="font-size: 11px; color: #cbd5e1;">일</span>
            </div>
          </div>
          <div style="text-align: center; margin-top: 12px; font-size: 13px; color: #64748B;">
            총 <strong style="color: #135bec;">4시간 35분</strong> 학습
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      홈
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      학습
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/><path d="M12 3v12"/><rect x="2" y="17" width="20" height="4" rx="1"/></svg>
      랭킹
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      프로필
    </a>
  </nav>
</body>
</html>
